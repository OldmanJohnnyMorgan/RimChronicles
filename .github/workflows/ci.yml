name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore RimChronicles.slnx
      # RimChronicles.Game builds without game sources here (no RimWorld install in CI).
      - name: Build
        run: dotnet build RimChronicles.slnx --no-restore -c Release
      - name: Test
        run: dotnet test RimChronicles.slnx --no-build -c Release
