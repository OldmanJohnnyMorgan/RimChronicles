[project]
name = "rimchron-train"
version = "0.1.0"
description = "Fine-tuning for the Rim Chronicles plot director (training track). Never shipped with the mod."
requires-python = ">=3.11,<3.13"
# Lower bounds here; exact versions are pinned by uv.lock, created on the training PC (`uv lock`) and committed.
dependencies = [
    "torch>=2.7",          # CUDA 12.8 build (Blackwell / RTX 50-series), from the index below
    "unsloth",
    "transformers",
    "trl",
    "peft",
    "datasets",
    "pyyaml",
]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rimchron_train"]
