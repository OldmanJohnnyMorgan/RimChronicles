# Full director SFT (D6). Same keys as d0.yaml; values from the training spec §5.2.
base_model: unsloth/gemma-4-E4B-it      # VERIFY as in d0.yaml
ollama_base: gemma4:e4b
dataset: data/splits/recommended
output_dir: ~/rimchron-runs
export_dir: /mnt/c/RimworldMods/rc-models
run_name: director-e4b
instruction_marker: "<start_of_turn>user\n"
response_marker: "<start_of_turn>model\n"
load_in_4bit: true
max_seq_length: 4096
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
learning_rate: 2.0e-4
warmup_ratio: 0.03
per_device_batch: 2
grad_accumulation: 8
epochs: 3
seed: 1
quantizations: [q4_k_m, q8_0]
